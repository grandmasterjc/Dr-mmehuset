<title>Drømmehuset</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: a photo-studio scene on top (close-up, full figure or house), text tabs under it, options below. Side by side on wide screens. */
:root{
  --bg:#eeecef; --panel:#ffffff; --ink:#1d1b22; --soft:#6d6877; --accent:#a8455f;
  --chip:#f4f2f5; --line:#dcd8e0; --good:#3f7d63;
  --display:"Bodoni Moda","Didot","Times New Roman",serif;
  --body:"Jost","Avenir Next","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a; --panel:#222127; --ink:#f0edf2; --soft:#a39fad; --accent:#e092a8;
  --chip:#2c2b33; --line:#3d3b47; --good:#7cc4a4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161a; --panel:#222127; --ink:#f0edf2; --soft:#a39fad; --accent:#e092a8;
  --chip:#2c2b33; --line:#3d3b47; --good:#7cc4a4; color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;max-width:1080px;margin:0 auto;padding-block:12px;display:grid;gap:10px;
  grid-template-rows:auto minmax(0,1.35fr) auto minmax(0,1fr)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(.95rem,4.1vw,1.7rem);min-width:0;line-height:1;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--ink);color:var(--bg);font-weight:500;font-size:.9rem;letter-spacing:.04em;
  padding:8px 14px;border-radius:6px}
.btn.ghost{background:#ffffffd9;color:#1d1b22;border:1px solid #1d1b2233}

.stage{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative;border-radius:10px;overflow:hidden;min-height:0;
  background:radial-gradient(120% 90% at 50% 28%,#f5f2f0 0%,#ddd7d5 58%,#c4bdbb 100%)}
#scene{position:absolute;inset:0}
#scene svg{width:100%;height:100%;display:block}
.stagebtns{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.stagebtns .btn,.stagefoot .btn{pointer-events:auto}
.stagefoot{position:absolute;left:14px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:none}
#pname{font-family:var(--display);font-weight:500;font-size:1.35rem;line-height:1;color:#1d1b22;min-width:0;overflow-wrap:anywhere}
.people{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:0 1 auto;scrollbar-width:none;padding:3px;margin:-3px}
.people::-webkit-scrollbar{display:none}
.purse{flex:none}
.sndbtn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;padding:0}
.sndbtn svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.purse{margin-left:auto;font-weight:600;font-size:1rem;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 9px;font-variant-numeric:tabular-nums}
@media (max-width:480px){.people .av{width:34px;height:34px}}
header{min-width:0}
h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:42px;height:42px;border-radius:50%;overflow:hidden;padding:0;background:#ddd7d5;box-shadow:0 0 0 1px var(--line);flex:none}
.av.on{box-shadow:0 0 0 2.5px var(--accent)}
.av svg{width:100%;height:100%;display:block}
.panel>*{flex-shrink:0}
.panel>.result{flex:none}
.stagefoot[hidden],#gl3[hidden],.pad[hidden],.toast[hidden]{display:none}
.chat{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:1.02rem;line-height:1.45}
.chat p{margin:0 0 4px}
.chat p:last-child{margin:0}
.txt.ltxt{max-width:520px;min-height:120px;resize:vertical;line-height:1.45;background:#fbf7ec;color:#2a2622;border-color:#e0d6bf}
.letter{background:#fbf7ec;color:#2a2622;border:1px solid #e0d6bf;border-radius:4px;padding:18px 18px 14px;box-shadow:0 2px 8px #0002;font-size:1.05rem;line-height:1.5;max-width:520px}
.letter p{margin:0 0 10px}
.letter .eye{display:block;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#8a6a4a;margin-bottom:10px}
.letter .sig{font-family:var(--display);font-size:1.25rem;margin:14px 0 0}
.buybar{position:sticky;bottom:-14px;margin:0 -16px -14px;padding:12px 16px 14px;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 16px #0001;display:flex;flex-direction:column;gap:8px}
.buybar p{margin:0}
.bub{position:absolute;transform:translate(-50%,calc(-100% - 8px));background:#fff;color:#1d1b22;padding:6px 11px;border-radius:12px;font-size:.88rem;line-height:1.3;max-width:62%;width:max-content;text-align:center;box-shadow:0 2px 8px #0003;pointer-events:none}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.bub[hidden]{display:none}
.toast{position:absolute;left:12px;right:12px;top:54px;background:#1d1b22ee;color:#fff;padding:9px 12px;border-radius:8px;font-size:.9rem;text-align:center;pointer-events:none}
.hud{display:flex;flex-direction:column;gap:7px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.hudtop{display:flex;align-items:center;gap:12px;font-weight:600;font-size:.9rem}
.coin::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#d4a843;box-shadow:inset 0 0 0 2px #b5892a;margin-right:6px;vertical-align:-1px}
.xp{flex:1;height:6px;border-radius:3px;background:var(--chip);overflow:hidden;min-width:40px}
.xp b{display:block;height:100%;background:var(--accent)}
.needs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:5px 16px}
.nb{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--soft)}
.nb span{width:66px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb i{flex:1;height:7px;border-radius:4px;background:var(--chip);overflow:hidden}
.nb b{display:block;height:100%;background:var(--good);border-radius:4px}
.nb b.low{background:var(--accent)}
.tasks{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.tasks li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;background:var(--chip);border-radius:6px}
.tasks span{color:var(--good);font-weight:600;white-space:nowrap}
#gl3{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pad{position:absolute;left:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:4px}
.pad .btn{padding:0;font-size:1.3rem;touch-action:none;user-select:none;-webkit-user-select:none}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.bar{position:relative;height:26px;min-height:26px;border-radius:13px;width:100%;max-width:360px;margin:10px 0;
  background:linear-gradient(90deg,#d8c3a5 0 55%,#4f9a78 55% 78%,#6b3a2a 78%)}
.bar i{position:absolute;top:-6px;left:0;width:5px;height:38px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--panel);animation:heat 3.6s linear forwards}
@keyframes heat{to{left:100%}}
.plate{width:120px;flex:none}
.cl{animation:drift 2.5s linear forwards}
@keyframes drift2{from{transform:translateX(70px)}to{transform:translateX(-10px)}}
.cl2{animation:drift2 7s linear infinite}
@keyframes drift{from{transform:translateX(260px)}to{transform:translateX(-520px)}}
@media (prefers-reduced-motion:reduce){.cl,.cl2{animation:none}}
.txt{font:inherit;color:inherit;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;max-width:220px}

.tabs{display:grid;grid-template-columns:repeat(8,1fr);border-bottom:1px solid var(--line)}
.tab{font-weight:500;font-size:.72rem;letter-spacing:.01em;text-transform:uppercase;padding:9px 2px;
  color:var(--soft);min-width:0;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--panel);border-radius:10px;padding:14px 16px;overflow-y:auto;min-height:0;
  display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-direction:column;gap:7px}
.row h2{font-weight:500;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--soft)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);position:relative}
.sw.none{background:var(--panel)}
.sw.none::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:1.5px;margin-top:-.75px;
  background:var(--soft);transform:rotate(-45deg)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.chip{padding:8px 13px;border-radius:6px;background:var(--chip);border:1px solid var(--line);font-size:.95rem;
  display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip.lock{color:var(--soft);border-style:dashed}
.lk{width:11px;height:11px;fill:currentColor;flex:none}
.hint{font-size:.85rem;color:var(--soft);margin:0}

.gift{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.giftbtn{width:150px;flex:none;padding:0}
.giftbtn svg{display:block;width:100%}
.giftbtn .lid{transition:transform .35s;transform-box:fill-box;transform-origin:10% 100%}
.giftbtn.open .lid{transform:translate(-6px,-20px) rotate(-14deg)}
.giftbtn.shake{animation:shake .7s}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
.result{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.result .eye{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--soft)}
.result.good .eye{color:var(--good)} .result.bad .eye{color:var(--accent)}
.result h3{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.1;margin:0;text-wrap:balance}
.result p{margin:0 0 6px}

@media (min-width:820px){
  .app{grid-template-columns:1.1fr 1fr;grid-template-rows:auto auto minmax(0,1fr);column-gap:18px}
  header{grid-column:1/-1}
  .tab{font-size:.95rem;letter-spacing:.06em}
  .stage{grid-row:2/4}
}
@media (prefers-reduced-motion:reduce){.giftbtn.shake{animation:none}.giftbtn .lid{transition:none}}
</style>

<div class="app">
  <header>
    <h1>Drømmehuset</h1>
    <span class="coin purse" id="coins" title="Mynter"></span><button type="button" class="sndbtn" id="snd" aria-label="Lyd"></button><div class="people" id="people"></div>
  </header>
  <div class="stage" id="stage">
    <div id="scene"></div>
    <canvas id="gl3" hidden></canvas>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="bub" id="bub" hidden></div>
    <div class="pad" id="pad" hidden><button type="button" class="btn ghost" data-dir="u" aria-label="Gå innover" style="grid-area:1/2">↑</button><button type="button" class="btn ghost" data-dir="l" aria-label="Gå til venstre" style="grid-area:2/1">←</button><button type="button" class="btn ghost" data-dir="d" aria-label="Gå utover" style="grid-area:2/2">↓</button><button type="button" class="btn ghost" data-dir="r" aria-label="Gå til høyre" style="grid-area:2/3">→</button></div>
    <div class="stagebtns">
      <span><button class="btn" id="fix" type="button" hidden>Fiks det</button></span>
      <button class="btn ghost" id="zoom" type="button">Hel figur</button>
    </div>
    <div class="stagefoot" id="foot"><span id="pname"></span><button class="btn ghost" id="random" type="button">Tilfeldig stil</button></div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function answer(t){
  const q=t.toLowerCase(),has=w=>new RegExp(w).test(q),pt=P().pet,ds=Object.keys(DEST);
  if(has('dum|stygg|hater|teit|idiot'))return 'Det var ikke så hyggelig sagt. Skal vi snakke om noe annet?';
  if(has('ha det|hade|farvel|må gå|snakkes'))return 'Ha det bra! Kom snart igjen.';
  if(has('hvordan (går|har)|går det|har du det'))return 'Jeg har det kjempebra. Hva med deg?';
  if(has('^(hei|hallo|heisann|halla|god dag)'))return 'Hei! Så hyggelig å se deg.';
  if(has('mat|sulten|spise|pizza|kake|taco|vafl|middag|pannekake'))return 'Jeg elsker mat! Kan du lage noe til meg neste gang?';
  if(has('dyr|katt|hund|kanin|valp|pus'))return pt.type!=='none'?'Hils '+pt.name+' fra meg! Jeg vil gjerne klappe litt neste gang.':'Du burde skaffe deg et kjæledyr. Dyrebutikken har mange søte.';
  if(has('reis|fly|ferie|tur|land|paris|london|tokyo|roma'))return 'Jeg drømmer om å reise til '+DEST[pick(ds)][0]+'. Blir du med?';
  if(has('klær|kjole|hår|sminke|fin|pen|stil|antrekk'))return 'Tusen takk! Jeg liker stilen din også.';
  if(has('hus|rom|sofa|stue|pusse'))return 'Huset ditt er så fint. Jeg vil pusse opp, jeg også.';
  if(has('lek|spill|gøy|finne på|kjede'))return 'Ja! La oss finne på noe gøy sammen.';
  if(has('venn|glad i|savn|liker deg'))return 'Du er bestevennen min.';
  if(has('skole|lekse|jobb'))return 'Uff, ja. Men nå har vi fri!';
  if(has('trøtt|sove|sliten'))return 'Du kan hvile i sofaen min hvis du vil.';
  if(has('takk'))return 'Bare hyggelig!';
  if(has('bra|fint|topp|supert|flott'))return 'Så bra! Det gjør meg glad.';
  if(has('trist|lei meg|dårlig|vondt'))return 'Å, så leit. Jeg er her for deg.';
  if(has('\\?'))return pick(['Godt spørsmål. Hva tror du selv?','Det må jeg tenke litt på.','Ja, jeg tror det!']);
  return pick(['Fortell mer!','Ja, det er jeg enig i.','Så spennende!','Haha, du er morsom.']);
}

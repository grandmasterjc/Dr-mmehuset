name: Bygg iOS-appen

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Vis Xcode-versjon
        run: xcodebuild -version
      - name: Bygg for simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/Drommehuset.xcodeproj -target Drommehuset -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO SYMROOT=$PWD/build build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Start appen i simulator og ta skjermbilder
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Drommehuset.app
          xcrun simctl launch "$UDID" com.grandmasterjc.drommehuset
          sleep 6
          mkdir -p shots
          xcrun simctl io "$UDID" screenshot shots/iphone.png
          IPAD=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPad')))")
          xcrun simctl boot "$IPAD"
          xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl install "$IPAD" build/Debug-iphonesimulator/Drommehuset.app
          xcrun simctl launch "$IPAD" com.grandmasterjc.drommehuset
          sleep 6
          xcrun simctl io "$IPAD" screenshot shots/ipad.png
      - uses: actions/upload-artifact@v4
        with:
          name: skjermbilder
          path: shots/

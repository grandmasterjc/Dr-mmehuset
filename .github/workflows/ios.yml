name: Bygg iOS-appen

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bygg for simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/Drommehuset.xcodeproj -target Drommehuset -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO SYMROOT=$PWD/build build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Feil fra byggingen
        if: failure()
        run: grep -E "error:" -A3 build.log | head -150 || true
      - name: Skjermbilder i simulator
        timeout-minutes: 20
        continue-on-error: true
        run: |
          pick() { xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('$1')))"; }
          to() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          mkdir -p shots
          shoot() { # enhet navn argumenter...
            dev=$1; name=$2; shift 2
            xcrun simctl terminate "$dev" com.grandmasterjc.drommehuset 2>/dev/null || true
            to 90 xcrun simctl launch "$dev" com.grandmasterjc.drommehuset "$@"
            sleep ${WAIT:-5}
            to 60 xcrun simctl io "$dev" screenshot "shots/$name.png"
          }
          P=$(pick "iPhone 16"); xcrun simctl boot "$P"; to 400 xcrun simctl bootstatus "$P" -b || true
          xcrun simctl install "$P" build/Debug-iphonesimulator/Drommehuset.app
          shoot "$P" iphone-sminke -tab sminke
          shoot "$P" iphone-hus-ute -tab hus -husvis ute
          shoot "$P" iphone-hus-stue -tab hus -husvis inne -rom stue -tid kveld
          shoot "$P" iphone-hus-kjokken -tab hus -husvis inne -rom kjokken -tid dag
          shoot "$P" iphone-barn -tab barn
          WAIT=9 shoot "$P" iphone-liv -tab liv -sted hjem
          WAIT=9 shoot "$P" iphone-liv-venn -tab liv -sted venn
          shoot "$P" iphone-liv-ute -tab liv -sted ute
          shoot "$P" iphone-liv-bil -tab liv -sted bil
          shoot "$P" iphone-liv-flyplass -tab liv -sted flyplass
          I=$(pick "iPad"); xcrun simctl boot "$I"; to 400 xcrun simctl bootstatus "$I" -b || true
          xcrun simctl install "$I" build/Debug-iphonesimulator/Drommehuset.app
          shoot "$I" ipad-hus -tab hus -husvis ute
          WAIT=9 shoot "$I" ipad-liv -tab liv
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skjermbilder
          path: shots/

name: Bygg iOS-appen

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Vis Xcode-versjon
        run: xcodebuild -version
      - name: Bygg for simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/Drommehuset.xcodeproj -target Drommehuset -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
